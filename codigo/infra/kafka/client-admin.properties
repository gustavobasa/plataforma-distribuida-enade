# Cliente administrativo (principal admin@ENADE.LOCAL, super user) usado pelo job kafka-setup
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true useTicketCache=false keyTab="/keytabs/admin.keytab" principal="admin@ENADE.LOCAL";
