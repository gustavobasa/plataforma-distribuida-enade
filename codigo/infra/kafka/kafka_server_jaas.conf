// Identidade do broker/controller no Kerberos (usada nos listeners SASL_PLAINTEXT e CONTROLLER)
KafkaServer {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    useTicketCache=false
    keyTab="/keytabs/kafka.keytab"
    principal="kafka/kafka.enade.local@ENADE.LOCAL";
};
