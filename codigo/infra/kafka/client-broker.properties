# Cliente administrativo usando a identidade do próprio broker (health check)
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true useTicketCache=false keyTab="/keytabs/kafka.keytab" principal="kafka/kafka.enade.local@ENADE.LOCAL";
