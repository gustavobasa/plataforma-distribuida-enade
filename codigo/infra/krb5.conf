# Configuração de cliente Kerberos compartilhada por todos os serviços.
[libdefaults]
    default_realm = ENADE.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    # Força TCP (evita fragmentação UDP na rede Docker)
    udp_preference_limit = 1

[realms]
    ENADE.LOCAL = {
        kdc = kdc.enade.local:88
        admin_server = kdc.enade.local
    }

[domain_realm]
    .enade.local = ENADE.LOCAL
    enade.local = ENADE.LOCAL
